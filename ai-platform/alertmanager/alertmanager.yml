global:
  resolve_timeout: 5m
  # Configurar SMTP si se desea notificaciones por correo
  # smtp_smarthost: 'smtp.example.edu.ec:587'
  # smtp_from: 'ai-platform@example.edu.ec'
  # smtp_auth_username: 'alertas@example.edu.ec'
  # smtp_auth_password: 'password'

route:
  group_by: ["alertname", "severity"]
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: default
      repeat_interval: 4h

receivers:

  - name: default
    # Activar cuando se tenga webhook o SMTP configurado
    # email_configs:
    #   - to: 'coordinacion@example.edu.ec'
    #     subject: '[AI Platform] Alerta: {{ .GroupLabels.alertname }}'
    #     html: '{{ range .Alerts }}{{ .Annotations.description }}<br>{{ end }}'
    webhook_configs: []

  - name: critical
    # email_configs:
    #   - to: 'coordinacion@example.edu.ec, admin@example.edu.ec'
    #     subject: '[AI Platform][CRÍTICO] {{ .GroupLabels.alertname }}'
    #     html: '{{ range .Alerts }}{{ .Annotations.description }}<br>{{ end }}'
    webhook_configs: []

inhibit_rules:
  # Si el servicio está completamente caído, silenciar alertas de latencia/errores
  - source_match:
      alertname: LiteLLMDown
    target_match_re:
      alertname: "High.*|VLLMQueue.*"
    equal: ["environment"]
