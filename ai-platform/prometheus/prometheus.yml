global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    environment: "ai-platform-pilot"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:

  # ─── LiteLLM ───────────────────────────────────────────────────────────────
  - job_name: litellm
    static_configs:
      - targets: ["litellm:4000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── vLLM: edu-fast ────────────────────────────────────────────────────────
  - job_name: vllm-edu-fast
    static_configs:
      - targets: ["edu-fast:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── vLLM: edu-main ────────────────────────────────────────────────────────
  - job_name: vllm-edu-main
    static_configs:
      - targets: ["edu-main:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── vLLM: edu-reasoner ────────────────────────────────────────────────────
  - job_name: vllm-edu-reasoner
    static_configs:
      - targets: ["edu-reasoner:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── vLLM: edu-pro (puede estar detenido) ──────────────────────────────────
  - job_name: vllm-edu-pro
    static_configs:
      - targets: ["edu-pro:8000"]
    metrics_path: /metrics
    scrape_interval: 30s

  # ─── NVIDIA DCGM Exporter ──────────────────────────────────────────────────
  - job_name: dcgm-exporter
    static_configs:
      - targets: ["dcgm-exporter:9400"]
    scrape_interval: 15s

  # ─── Node Exporter ─────────────────────────────────────────────────────────
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
    scrape_interval: 15s

  # ─── cAdvisor ──────────────────────────────────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metrics_path: /metrics
    scrape_interval: 15s

  # ─── Prometheus self-monitoring ────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
