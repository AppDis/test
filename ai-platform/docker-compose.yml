# Equipo: NVIDIA GB10 (Grace Blackwell) · Ubuntu 24.04 · ARM64 (aarch64)
# vLLM usa imagen ARM64 específica: vllm/vllm-openai:latest-aarch64-cu129-ubuntu2404
# LiteLLM en ghcr.io soporta multi-arch (ARM64 incluido).

networks:
  ups-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:

  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ups-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - litellm
    networks:
      - ups-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── LiteLLM Gateway ──────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ups-litellm
    expose:
      - "4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      UI_USERNAME: ${UI_USERNAME}
      UI_PASSWORD: ${UI_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ups-internal
    restart: unless-stopped

  # ─── Base de datos ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ups-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ups-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ups-redis
    volumes:
      - redis_data:/data
    networks:
      - ups-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Modelo rápido ────────────────────────────────────────────────────────
  ups-fast:
    image: vllm/vllm-openai:latest-aarch64-cu129-ubuntu2404
    container_name: ups-fast
    runtime: nvidia
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-7B-Instruct"
      - "--served-model-name"
      - "ups-fast"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "16384"
      - "--gpu-memory-utilization"
      - "0.13"
      - "--enable-chunked-prefill"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      - ups-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ─── Modelo principal ─────────────────────────────────────────────────────
  ups-main:
    image: vllm/vllm-openai:latest-aarch64-cu129-ubuntu2404
    container_name: ups-main
    runtime: nvidia
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-32B-Instruct-AWQ"
      - "--served-model-name"
      - "ups-main"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "32768"
      - "--gpu-memory-utilization"
      - "0.25"
      - "--enable-chunked-prefill"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8002:8000"
    networks:
      - ups-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ─── Modelo razonador (bajo demanda) ─────────────────────────────────────
  # No arranca por defecto — requiere detener ups-main primero (memoria insuficiente
  # para correr los 3 modelos BF16 simultáneamente en 121 GB).
  # Activar con: scripts/start-reasoner.sh
  ups-reasoner:
    image: vllm/vllm-openai:latest-aarch64-cu129-ubuntu2404
    container_name: ups-reasoner
    runtime: nvidia
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/DeepSeek-R1-Distill-Qwen-32B"
      - "--served-model-name"
      - "ups-reasoner"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "8192"
      - "--gpu-memory-utilization"
      - "0.55"
      - "--enable-chunked-prefill"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8003:8000"
    networks:
      - ups-internal
    profiles:
      - reasoning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # ─── Modelo premium (bajo demanda) ───────────────────────────────────────
  ups-pro:
    image: vllm/vllm-openai:latest-aarch64-cu129-ubuntu2404
    container_name: ups-pro
    runtime: nvidia
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-72B-Instruct-AWQ"
      - "--served-model-name"
      - "ups-pro"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "32768"
      - "--enable-chunked-prefill"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "hermes"
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8004:8000"
    networks:
      - ups-internal
    profiles:
      - premium
    restart: unless-stopped
