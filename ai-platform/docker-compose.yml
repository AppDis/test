version: "3.9"

networks:
  ai-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:

services:

  # ─── Reverse Proxy ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - litellm
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── LiteLLM Gateway ──────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    expose:
      - "4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STORE_MODEL_IN_DB: "True"
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "4"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── Base de datos ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── Modelo rápido (edu-fast) ─────────────────────────────────────────────
  edu-fast:
    image: vllm/vllm-openai:latest
    container_name: edu-fast
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-7B-Instruct"
      - "--served-model-name"
      - "edu-fast"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "32768"
      - "--enable-chunked-prefill"
    expose:
      - "8000"
    ports:
      - "8001:8000"
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── Modelo principal (edu-main) ──────────────────────────────────────────
  edu-main:
    image: vllm/vllm-openai:latest
    container_name: edu-main
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-32B-Instruct-AWQ"
      - "--served-model-name"
      - "edu-main"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "32768"
      - "--enable-chunked-prefill"
    expose:
      - "8000"
    ports:
      - "8002:8000"
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── Modelo razonador (edu-reasoner) ─────────────────────────────────────
  edu-reasoner:
    image: vllm/vllm-openai:latest
    container_name: edu-reasoner
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/DeepSeek-R1-Distill-Qwen-32B"
      - "--served-model-name"
      - "edu-reasoner"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "32768"
      - "--enable-chunked-prefill"
    expose:
      - "8000"
    ports:
      - "8003:8000"
    networks:
      - ai-internal
    restart: unless-stopped

  # ─── Modelo premium bajo demanda (edu-pro) ────────────────────────────────
  edu-pro:
    image: vllm/vllm-openai:latest
    container_name: edu-pro
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${MODELS_PATH}:/models
    command:
      - "--model"
      - "/models/Qwen2.5-72B-Instruct-AWQ"
      - "--served-model-name"
      - "edu-pro"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--quantization"
      - "awq"
      - "--max-model-len"
      - "32768"
      - "--enable-chunked-prefill"
    expose:
      - "8000"
    ports:
      - "8004:8000"
    networks:
      - ai-internal
    profiles:
      - premium
    restart: unless-stopped

  # ─── Observabilidad ───────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    expose:
      - "9090"
    networks:
      - ai-internal
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    expose:
      - "3000"
    depends_on:
      - prometheus
    networks:
      - ai-internal
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    expose:
      - "9093"
    networks:
      - ai-internal
    restart: unless-stopped

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.6-3.4.2-ubuntu22.04
    container_name: dcgm-exporter
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    cap_add:
      - SYS_ADMIN
    expose:
      - "9400"
    networks:
      - ai-internal
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    expose:
      - "9100"
    networks:
      - ai-internal
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - ai-internal
    restart: unless-stopped
