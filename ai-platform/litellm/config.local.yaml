general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  max_budget: null
  budget_duration: null

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 180
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 180
  drop_params: true

  # Sin callbacks de Prometheus en local (no hay servidor Prometheus en este entorno)
  cache: true
  cache_params:
    cache_type: redis
    host: redis
    port: 6379

# Los tres aliases siempre activos apuntan a Ollama (un solo backend CPU).
# ups-pro se registra vía API al ejecutar start-premium-model.sh --local
# Mismos alias names que producción → los scripts y pruebas de API son idénticos.

model_list:

  - model_name: ups-fast
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 60
      max_retries: 2
    model_info:
      description: "Local (CPU) — alias rápido → llama3.2:3b vía Ollama"
      max_tokens: 32768

  - model_name: ups-main
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 120
      max_retries: 2
    model_info:
      description: "Local (CPU) — alias principal → llama3.2:3b vía Ollama"
      max_tokens: 32768

  - model_name: ups-reasoner
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 180
      max_retries: 1
    model_info:
      description: "Local (CPU) — alias razonador → llama3.2:3b vía Ollama"
      max_tokens: 32768

# ups-pro se registra dinámicamente con start-premium-model.sh --local
