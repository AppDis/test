general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 180
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 180
  drop_params: true

  cache: true
  cache_params:
    cache_type: redis
    host: redis
    port: 6379

# Todos los aliases apuntan al mismo modelo local (llama3.2:3b).
# Esto simula la misma topología de aliases que en producción sin necesitar GPU.
# En Mac Intel Docker corre en CPU: esperar ~5-15 tokens/s.

model_list:

  - model_name: ups-fast
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 120
    model_info:
      description: "Simulación local — alias rápido → llama3.2:3b vía Ollama"

  - model_name: ups-main
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 180
    model_info:
      description: "Simulación local — alias principal → llama3.2:3b vía Ollama"

  - model_name: ups-reasoner
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 180
    model_info:
      description: "Simulación local — alias razonador → llama3.2:3b vía Ollama"

  - model_name: ups-pro
    litellm_params:
      model: openai/llama3.2:3b
      api_base: http://ollama:11434/v1
      api_key: none
      timeout: 300
    model_info:
      description: "Simulación local — alias premium → llama3.2:3b vía Ollama"
