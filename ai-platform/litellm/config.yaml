general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  # Cache con Redis
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379

  # Límites globales de seguridad
  max_budget: null
  budget_duration: null

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120
  retry_after: 5

litellm_settings:
  # Reintentos ante fallos transitorios
  num_retries: 2
  request_timeout: 120

  # Callbacks de observabilidad (Prometheus)
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]

  # Drop parámetros no soportados por vLLM
  drop_params: true

model_list:

  - model_name: edu-fast
    litellm_params:
      model: openai/edu-fast
      api_base: http://edu-fast:8000/v1
      api_key: none
      timeout: 60
      max_retries: 2
    model_info:
      description: "Modelo rápido para consultas simples y baja latencia"
      max_tokens: 32768

  - model_name: edu-main
    litellm_params:
      model: openai/edu-main
      api_base: http://edu-main:8000/v1
      api_key: none
      timeout: 120
      max_retries: 2
    model_info:
      description: "Asistente académico general, programación, Sistemas Distribuidos"
      max_tokens: 32768

  - model_name: edu-reasoner
    litellm_params:
      model: openai/edu-reasoner
      api_base: http://edu-reasoner:8000/v1
      api_key: none
      timeout: 180
      max_retries: 1
    model_info:
      description: "Modelo de razonamiento para análisis, planificación y rúbricas"
      max_tokens: 32768

  - model_name: edu-pro
    litellm_params:
      model: openai/edu-pro
      api_base: http://edu-pro:8000/v1
      api_key: none
      timeout: 300
      max_retries: 1
    model_info:
      description: "Modelo premium bajo demanda, tareas complejas"
      max_tokens: 32768

  - model_name: edu-embed
    litellm_params:
      model: openai/edu-embed
      api_base: http://edu-embed:8000/v1
      api_key: none
      timeout: 30
    model_info:
      description: "Embeddings para RAG y búsqueda semántica"

# ─── Rate limits por defecto (ajustar en cada API Key si se requiere) ─────────
# Se configuran desde el panel de administración de LiteLLM o via API.
#
# edu-fast:    abierto
# edu-main:    rpm=60, tpm=100000
# edu-reasoner: rpm=20, tpm=80000
# edu-pro:     acceso restringido por API Key
