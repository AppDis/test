general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  max_budget: null
  budget_duration: null

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 120
  drop_params: true

  # Aliases explícitos: el cliente puede usar ups/qwen2.5-7b o ups-fast indistintamente.
  # Actualizar aquí si se cambia el modelo sin romper el código existente de los estudiantes.
  model_alias_map:
    "ups/qwen2.5-7b":      "ups-fast"
    "ups/qwen2.5-32b":     "ups-main"
    "ups/deepseek-r1-32b": "ups-reasoner"

  cache: true
  cache_params:
    cache_type: redis
    host: redis
    port: 6379

model_list:

  - model_name: ups-fast
    litellm_params:
      model: openai/ups-fast
      api_base: http://ups-fast:8000/v1
      api_key: none
      timeout: 60
      max_retries: 2
    model_info:
      description: "Qwen2.5-7B-Instruct — consultas simples y baja latencia"
      max_tokens: 32768
      input_cost_per_token: 0.00000004    # $0.04 / 1M tokens (ref. OpenRouter)
      output_cost_per_token: 0.0000001    # $0.10 / 1M tokens

  - model_name: ups-main
    litellm_params:
      model: openai/ups-main
      api_base: http://ups-main:8000/v1
      api_key: none
      timeout: 120
      max_retries: 2
    model_info:
      description: "Qwen2.5-32B-Instruct-AWQ — asistente académico general, programación"
      max_tokens: 32768
      input_cost_per_token: 0.00000079    # $0.79 / 1M tokens (ref. OpenRouter)
      output_cost_per_token: 0.00000079   # $0.79 / 1M tokens

  - model_name: ups-reasoner
    litellm_params:
      model: openai/ups-reasoner
      api_base: http://ups-reasoner:8000/v1
      api_key: none
      timeout: 180
      max_retries: 1
    model_info:
      description: "DeepSeek-R1-Distill-Qwen-32B — razonamiento, análisis, rúbricas"
      max_tokens: 32768
      input_cost_per_token: 0.00000029    # $0.29 / 1M tokens (ref. OpenRouter)
      output_cost_per_token: 0.00000029   # $0.29 / 1M tokens

# ups-pro y ups-embed se registran vía API cuando sus contenedores están activos.
# Ver scripts/start-premium-model.sh para ups-pro.
