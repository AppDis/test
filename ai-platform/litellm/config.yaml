general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  max_budget: null
  budget_duration: null

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 120

  # Callbacks de observabilidad (Prometheus)
  # "prometheus_system" es el identificador correcto en LiteLLM >= v1.35
  success_callback: ["prometheus_system"]
  failure_callback: ["prometheus_system"]

  drop_params: true

  # Cache con Redis
  cache: true
  cache_params:
    cache_type: redis
    host: redis
    port: 6379

model_list:

  - model_name: edu-fast
    litellm_params:
      model: openai/edu-fast
      api_base: http://edu-fast:8000/v1
      api_key: none
      timeout: 60
      max_retries: 2
    model_info:
      description: "Modelo rápido para consultas simples y baja latencia"
      max_tokens: 32768

  - model_name: edu-main
    litellm_params:
      model: openai/edu-main
      api_base: http://edu-main:8000/v1
      api_key: none
      timeout: 120
      max_retries: 2
    model_info:
      description: "Asistente académico general, programación, Sistemas Distribuidos"
      max_tokens: 32768

  - model_name: edu-reasoner
    litellm_params:
      model: openai/edu-reasoner
      api_base: http://edu-reasoner:8000/v1
      api_key: none
      timeout: 180
      max_retries: 1
    model_info:
      description: "Modelo de razonamiento para análisis, planificación y rúbricas"
      max_tokens: 32768

# ─── Modelos opcionales (gestionar vía API de LiteLLM cuando el contenedor esté activo) ─
#
# edu-pro y edu-embed NO se incluyen aquí porque sus contenedores son opcionales:
#   - edu-pro: perfil "premium" en docker-compose, levantar con start-premium-model.sh
#   - edu-embed: agregar servicio edu-embed a docker-compose antes de habilitar
#
# Para agregarlos en caliente sin reiniciar LiteLLM:
#   POST /model/new  -H "Authorization: Bearer $LITELLM_MASTER_KEY"
#   { "model_name": "edu-pro", "litellm_params": { "model": "openai/edu-pro",
#     "api_base": "http://edu-pro:8000/v1", "api_key": "none" } }

# ─── Rate limits por defecto (ajustar en cada API Key si se requiere) ─────────
# Se configuran desde el panel de administración de LiteLLM o via API.
#
# edu-fast      -> abierto
# edu-main      -> rpm=60, tpm=100000
# edu-reasoner  -> rpm=20, tpm=80000
# edu-pro       -> acceso restringido por API Key (solo cuando esté activo)
