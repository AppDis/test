general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

  max_budget: null
  budget_duration: null

router_settings:
  routing_strategy: least-busy
  num_retries: 2
  timeout: 120
  retry_after: 5

litellm_settings:
  num_retries: 2
  request_timeout: 120
  drop_params: true

  success_callback: ["prometheus_system"]
  failure_callback: ["prometheus_system"]

  cache: true
  cache_params:
    cache_type: redis
    host: redis
    port: 6379

model_list:

  - model_name: ups-fast
    litellm_params:
      model: openai/ups-fast
      api_base: http://ups-fast:8000/v1
      api_key: none
      timeout: 60
      max_retries: 2
    model_info:
      description: "Modelo rápido para consultas simples y baja latencia"
      max_tokens: 32768

  - model_name: ups-main
    litellm_params:
      model: openai/ups-main
      api_base: http://ups-main:8000/v1
      api_key: none
      timeout: 120
      max_retries: 2
    model_info:
      description: "Asistente académico general, programación, Sistemas Distribuidos"
      max_tokens: 32768

  - model_name: ups-reasoner
    litellm_params:
      model: openai/ups-reasoner
      api_base: http://ups-reasoner:8000/v1
      api_key: none
      timeout: 180
      max_retries: 1
    model_info:
      description: "Modelo de razonamiento para análisis, planificación y rúbricas"
      max_tokens: 32768

# ups-pro y ups-embed se registran vía API cuando sus contenedores están activos.
# Ver scripts/start-premium-model.sh para ups-pro.
