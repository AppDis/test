server {
    listen 80 default_server;
    server_name _;

    # ─── Límites básicos ─────────────────────────────────────────────────────
    client_max_body_size 10m;
    client_body_timeout  120s;
    proxy_read_timeout   300s;
    proxy_send_timeout   300s;
    proxy_connect_timeout 10s;

    # ─── Headers de seguridad ────────────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # ─── Health check público (sin autenticación) ────────────────────────────
    location = /health {
        proxy_pass         http://litellm:4000/health/liveliness;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ─── API principal (LiteLLM) ─────────────────────────────────────────────
    location /v1/ {
        proxy_pass         http://litellm:4000/v1/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ─── JupyterHub (/jupyter/) ─────────────────────────────────────────────
    location /jupyter/ {
        proxy_pass         http://jupyter:8000/jupyter/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
    }

    # ─── Panel de administración LiteLLM (/ui) ───────────────────────────────
    location / {
        proxy_pass         http://litellm:4000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }
}
